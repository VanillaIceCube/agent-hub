name: CodeQL Gate

on:
  workflow_call:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
      timezone: America/Los_Angeles
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Detect CodeQL Scope
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select the languages present in this revision
        id: detect
        shell: bash
        run: |
          languages=(actions)
          if [[ -n "$(git ls-files -- '*.py')" ]]; then
            languages+=(python)
          fi
          if [[ -n "$(git ls-files -- '*.js' '*.mjs' '*.cjs' '*.jsx' '*.ts' '*.mts' '*.cts' '*.tsx')" ]]; then
            languages+=(javascript-typescript)
          fi
          printf 'languages=%s\n' "$(jq -cn --args '$ARGS.positional' "${languages[@]}")" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze ${{ matrix.language }}
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.scope.outputs.languages) }}
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
